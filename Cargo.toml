[package]
name = "hello-openrouter"
version = "0.6.5"
edition = "2024"

[[bin]]
name = "hello-openrouter"
path = "src/bin/main.rs"

[features]
default = []
vision = ["dep:base64"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
clap = { version = "4.5.54", features = [ "derive" ] }
dotenvy = "0.15.7"
rama = { git = "https://github.com/plabayo/rama.git", tag = "rama-0.3.0-alpha.4", features = [ "http-full", "rustls" ] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
